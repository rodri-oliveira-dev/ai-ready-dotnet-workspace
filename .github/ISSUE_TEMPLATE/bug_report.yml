name: Bug report
description: Report a reproducible defect in the template, sample, tooling, or documentation.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened and include sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or repository state.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or generated-template version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, SDK, container/client version, and relevant configuration without secrets.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, private endpoints, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
