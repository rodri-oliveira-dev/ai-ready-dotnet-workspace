name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore AiReadyWorkspace.slnx

      - name: Verify formatting
        run: dotnet format AiReadyWorkspace.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build AiReadyWorkspace.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AiReadyWorkspace.slnx --configuration Release --no-build --logger "console;verbosity=normal"
